<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a3a26" />

    <!-- Conexión anticipada a Firebase (contenido y fotos) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />

    <!-- Tipografía: Fraunces (display serif) + Hanken Grotesk (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Inter:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />

    <!-- SEO -->
    <title>Kapac Made</title>
    <meta name="description" content="Mountaineering, Climbing &amp; Trekking" />
    <meta name="keywords" content="mochilas, Kapac Made, Arequipa, Perú, mochilas artesanales, mochilas Perú, aventura, outdoor, backpacks Peru, mochilas hechas a mano" />
    <meta name="author" content="Kapac Made" />
    <meta name="robots" content="index, follow, max-image-preview:none" />
    <link rel="canonical" href="https://www.kapac-made.com/" />
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "Kapac Made", "url": "https://www.kapac-made.com/" }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />

    <!-- Open Graph (al compartir en redes/WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.kapac-made.com/" />
    <meta property="og:title" content="Kapac Made" />
    <meta property="og:description" content="Mountaineering, Climbing &amp; Trekking" />
    <meta property="og:image" content="https://www.kapac-made.com/og-kapac.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Kapac Made" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kapac Made" />
    <meta name="twitter:description" content="Mountaineering, Climbing &amp; Trekking" />
    <meta name="twitter:image" content="https://www.kapac-made.com/og-kapac.jpg" />
    <script>
      if (location.hash.indexOf('#/') === 0) history.replaceState(null, '', location.hash.slice(1));
      try { if (localStorage.getItem('kapac_cerrado_v1') !== '0' && localStorage.getItem('kapac_dispositivo_admin') !== '1') document.documentElement.classList.add('cerrado'); } catch (e) {}
      // Portada de la visita anterior: empieza a bajar antes de que cargue la app
      try {
        var c = JSON.parse(localStorage.getItem('kapac_contenido_v1'));
        var h = c && c.heroVideo && c.heroVideo[innerWidth < 768 ? 'mobile' : 'pc'];
        if (location.pathname === '/' && h && h.tipo === 'imagen' && h.url && !document.documentElement.classList.contains('cerrado')) {
          var copias = window.__FOTOS__ || {}, ruta = decodeURIComponent((h.url.split('/o/')[1] || '').split('?')[0]);
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = copias[ruta] || h.url; l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        }
      } catch (e) {}
    </script>
    <style>
      html.cerrado, html.cerrado body { background: #0a0a0a; }
      html.cerrado #root:empty {
        position: fixed;
        inset: 0;
        background: #0a0a0a url('%PUBLIC_URL%/proximamente.jpg') center / cover no-repeat;
      }
      @media (min-aspect-ratio: 3/4) {
        html.cerrado #root:empty { background-size: auto 100%; }
      }
    </style>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ver Kapac Made.</noscript>
    <div id="root" data-nosnippet></div>
  </body>
</html>
